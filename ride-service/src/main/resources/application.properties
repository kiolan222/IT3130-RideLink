spring.application.name=ride-service
server.port=8083
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ridelink_ride}
ridelink.jwt.secret=${JWT_SECRET:ridelink-dev-jwt-secret-change-me-32bytes}
ridelink.jwt.expiration-ms=86400000
ridelink.driver-service-url=${DRIVER_SERVICE_URL:http://localhost:8082}
ridelink.fare-service-url=${FARE_SERVICE_URL:http://localhost:8084}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
springdoc.swagger-ui.path=/swagger-ui.html
